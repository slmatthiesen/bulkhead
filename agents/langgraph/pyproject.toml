[project]
name = "bulkhead-langgraph"
version = "0.1.0"
description = "The bulkhead supply-chain demo as a LangGraph graph with a Postgres checkpointer, deployable to Amazon Bedrock AgentCore Runtime."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["langchain-aws>=0.2"]
agentcore = ["bedrock-agentcore>=0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bulkhead_langgraph"]
