services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bulkhead
      POSTGRES_PASSWORD: bulkhead
      POSTGRES_DB: bulkhead
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulkhead"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
